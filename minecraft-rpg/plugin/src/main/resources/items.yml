# ============================================================================
#  RPGCore - předměty a sety brnění
#  Z tohoto souboru čte plugin (staty, schopnosti) I generátor resource packu
#  (tools/generate_pack.py - ikony a barvy). Po změně ikon/barev pusť generátor.
#
#  colors: [hlavní materiál, rukojeť/lem, drahokam/záře]
#  Staty: damage, defense, health, mana, strength, vitality, intelligence,
#         agility, crit_chance, crit_damage, speed, mana_regen, lifesteal
#  Elementy: FIRE, FROST, LIGHTNING, SHADOW, HOLY, VOID, ARCANE, POISON, EARTH
# ============================================================================

# ---------------------------------------------------------------------------
