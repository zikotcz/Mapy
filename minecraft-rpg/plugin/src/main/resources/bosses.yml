# ============================================================================
#  RPGCore - bossové
#
#  Každý boss je mob v kompletním kostýmu (set z items.yml), má boss bar,
#  fáze podle zbývajícího zdraví a schopnosti s varováním (kruh na zemi).
#
#  Typy schopností:
#    CHARGE    skok na cíl + úder            (damage)
#    SLAM      úder do země kolem bosse       (damage, radius, delay)
#    NOVA      velká vlna elementu            (damage, radius, delay, element)
#    BOLT      střely na hráče                (damage, count, element)
#    METEOR    dopad pod nohy hráčů           (damage, radius, count, delay, element)
#    LIGHTNING blesk na hráče                 (damage, count, delay)
#    TELEPORT  teleport za hráče + úder       (damage)
#    PULL      přitáhne hráče k sobě          (radius)
#    DRAIN     vysává život a léčí bosse      (damage, count)
#    SUMMON    vyvolá poskoky                 (mob, count, max)
#    HEAL      vyléčí část zdraví             (percent)
#    CURSE     oslabí hráče v okolí           (radius, duration, element)
#  cooldown je v sekundách, delay v ticích (20 = 1 s).
# ============================================================================

goblin_king:
  name: "Král goblinů"
  type: ZOMBIE
  level: 10
  health: 800
  damage: 12
  speed: 1.1
  scale: 1.5
  costume: goblin_king
  weapon: war_axe
  xp: 600
  coins: 250
  bar-color: GREEN
  ability-interval: 5
  abilities:
    charge: {type: CHARGE, damage: 16, cooldown: 9}
    goblins: {type: SUMMON, mob: goblin, count: 3, max: 6, cooldown: 22, message: "<green>Král goblinů svolává své poddané!"}
    slam: {type: SLAM, damage: 20, radius: 5, delay: 25, element: EARTH, cooldown: 11}
  phases:
    - {below: 100, abilities: [charge, goblins]}
    - {below: 50, abilities: [charge, goblins, slam], speed: 1.2, damage: 1.3, message: "<red>Král goblinů zuří!"}
  loot:
    - {item: soul_goblin_king, chance: 100}
    - {item: goblin_ear, chance: 100, min: 3, max: 8}
    - {item: war_axe, chance: 20}
    - {item: ring_of_strength, chance: 12}
    - {item: upgrade_stone, chance: 40, min: 1, max: 2}
    - {item: xp_tome, chance: 25}

