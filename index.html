<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fialová mapa – radary a rychlostní limity</title>
<meta name="theme-color" content="#1a0b2e">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root {
    --bg: #12071f;
    --panel: rgba(30, 14, 54, .88);
    --panel-solid: #1e0e36;
    --line: rgba(196, 160, 255, .22);
    --text: #f3ecff;
    --muted: #b9a5dc;
    --accent: #a855f7;
    --accent-2: #d946ef;
    --accent-soft: rgba(168, 85, 247, .18);
    --danger: #ff4d6d;
    --radius: 16px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
  }
  #map { position: fixed; inset: 0; background: var(--bg); }
  /* fialové tónování podkladové mapy */
  .leaflet-tile-pane { filter: sepia(1) hue-rotate(218deg) saturate(1.7) brightness(1.15) contrast(1.05); }

  .panel {
    position: fixed; z-index: 1000;
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 10px 30px rgba(8, 2, 20, .55);
  }

  /* horní lišta */
  #top { top: 12px; left: 12px; width: min(380px, calc(100vw - 24px)); padding: 12px; }
  #top h1 {
    margin: 0 0 10px; font-size: 17px; letter-spacing: .2px; display: flex; align-items: center; gap: 8px;
  }
  #top h1 .dot {
    width: 12px; height: 12px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    box-shadow: 0 0 12px var(--accent-2);
  }
  #search { display: flex; gap: 8px; }
  #search input {
    flex: 1; min-width: 0; padding: 10px 12px; border-radius: 12px;
    border: 1px solid var(--line); background: rgba(10, 3, 22, .6); color: var(--text); font: inherit;
  }
  #search input::placeholder { color: var(--muted); }
  #search input:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  button {
    font: inherit; color: var(--text); cursor: pointer; border-radius: 12px;
    border: 1px solid var(--line); background: var(--accent-soft); padding: 10px 12px;
  }
  button:hover { background: rgba(168, 85, 247, .32); }
  button.primary { background: linear-gradient(135deg, var(--accent), var(--accent-2)); border-color: transparent; font-weight: 600; }
  #toggles { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; padding: 7px 11px; border-radius: 999px;
    border: 1px solid var(--line); background: transparent; font-size: 13px; color: var(--muted);
  }
  .chip[aria-pressed="true"] { background: var(--accent-soft); color: var(--text); border-color: var(--accent); }
  #status { margin-top: 10px; font-size: 12.5px; color: var(--muted); min-height: 1.4em; }
  #status.err { color: #ffb3c1; }

  /* HUD – kolik mám jet */
  #hud {
    left: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); padding: 12px 14px;
    display: flex; align-items: center; gap: 14px;
  }
  .sign {
    width: 74px; height: 74px; border-radius: 50%; flex: none;
    background: #fff; color: #1a0b2e; border: 8px solid var(--accent-2);
    display: grid; place-items: center; font-weight: 800; font-size: 26px; letter-spacing: -1px;
    box-shadow: 0 0 0 2px rgba(255,255,255,.15), 0 0 18px rgba(217, 70, 239, .5);
  }
  .sign.unknown { color: #8b7aa8; }
  #speedBox { min-width: 96px; }
  #speed { font-size: 34px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
  #speed small { font-size: 13px; font-weight: 500; color: var(--muted); margin-left: 4px; }
  #hud .lbl { font-size: 12px; color: var(--muted); margin-top: 4px; max-width: 170px; }
  #hud.over { border-color: var(--danger); box-shadow: 0 0 0 2px var(--danger), 0 10px 30px rgba(255, 77, 109, .4); }
  #hud.over #speed { color: var(--danger); }

  /* upozornění na radar */
  #alert {
    top: 12px; left: 50%; transform: translate(-50%, -160%); transition: transform .3s;
    padding: 10px 16px; border-color: var(--danger); background: rgba(70, 8, 40, .95);
    font-weight: 700; white-space: nowrap; z-index: 1100;
  }
  #alert.show { transform: translate(-50%, 0); }

  /* legenda */
  #legend { right: 12px; bottom: calc(28px + env(safe-area-inset-bottom)); width: 230px; font-size: 13px; }
  #legend summary { cursor: pointer; padding: 10px 12px; font-weight: 600; list-style: none; }
  #legend summary::-webkit-details-marker { display: none; }
  #legend summary::after { content: "▾"; float: right; color: var(--muted); }
  #legend[open] summary::after { content: "▴"; }
  #legend .body { padding: 0 12px 12px; }
  #legend h3 { margin: 10px 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); }
  #legend ul { list-style: none; margin: 0; padding: 0; }
  #legend li { display: flex; align-items: center; gap: 8px; padding: 2px 0; }
  #legend li b { margin-left: auto; }
  .sw { width: 22px; height: 5px; border-radius: 3px; flex: none; }

  /* značky v mapě */
  .radar {
    width: 30px; height: 30px; border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #f0abfc, #a21caf 70%);
    border: 2px solid #fff; display: grid; place-items: center;
    box-shadow: 0 0 0 4px rgba(217, 70, 239, .28), 0 2px 8px rgba(0,0,0,.6);
  }
  .radar svg { width: 16px; height: 16px; fill: #fff; }
  .me {
    width: 20px; height: 20px; border-radius: 50%; background: #c084fc; border: 3px solid #fff;
    box-shadow: 0 0 0 8px rgba(192, 132, 252, .3);
  }
  .leaflet-popup-content-wrapper, .leaflet-popup-tip, .leaflet-tooltip {
    background: var(--panel-solid); color: var(--text); border: 1px solid var(--line);
    box-shadow: 0 8px 24px rgba(8, 2, 20, .6);
  }
  .leaflet-tooltip { border-radius: 8px; font-weight: 700; }
  .leaflet-tooltip::before { display: none; }
  .leaflet-popup-content { margin: 12px 14px; font-size: 14px; }
  .leaflet-popup-content b { color: #e9b8ff; }
  .leaflet-container a.leaflet-popup-close-button { color: var(--muted); }
  .leaflet-bar a, .leaflet-bar a:hover {
    background: var(--panel-solid); color: var(--text); border-color: var(--line);
  }
  .leaflet-control-attribution {
    background: rgba(18, 7, 31, .75) !important; color: var(--muted) !important; font-size: 10px;
  }
  .leaflet-control-attribution a { color: #d8b4fe !important; }

  @media (max-width: 640px) {
    #legend { display: none; }
    #hud { right: 12px; }
    .leaflet-control-zoom { display: none; }
    #alert { top: auto; bottom: calc(126px + env(safe-area-inset-bottom)); transform: translate(-50%, 300%); }
  }
</style>
</head>
<body>
<div id="map"></div>

<div id="top" class="panel">
  <h1><span class="dot"></span>Fialová mapa</h1>
  <form id="search">
    <input id="q" type="search" placeholder="Hledat město nebo adresu…" autocomplete="off" aria-label="Hledat místo">
    <button type="submit">Hledat</button>
    <button type="button" id="locate" class="primary" title="Sledovat moji polohu">◎ Jedu</button>
  </form>
  <div id="toggles">
    <button class="chip" id="tRadar" aria-pressed="true">📷 Radary</button>
    <button class="chip" id="tSpeed" aria-pressed="true">🚦 Rychlostní limity</button>
    <button class="chip" id="tSound" aria-pressed="true">🔔 Zvuk</button>
  </div>
  <div id="status" role="status"></div>
</div>

<div id="alert" class="panel" role="alert"></div>

<div id="hud" class="panel">
  <div class="sign unknown" id="limit" title="Povolená rychlost">–</div>
  <div id="speedBox">
    <div id="speed">–<small>km/h</small></div>
    <div class="lbl" id="hudLbl">Zapni „Jedu“ a uvidíš svou rychlost a limit.</div>
  </div>
</div>

<details id="legend" class="panel" open>
  <summary>Legenda</summary>
  <div class="body">
    <h3>Limity na silnicích</h3>
    <ul id="legSpeed"></ul>
    <h3>Obecné limity v ČR</h3>
    <ul>
      <li>V obci <b>50</b></li>
      <li>Mimo obec <b>90</b></li>
      <li>Silnice pro motorová vozidla <b>110</b></li>
      <li>Dálnice <b>130</b></li>
      <li>Dálnice v obci <b>80</b></li>
      <li>Obytná zóna <b>20</b></li>
    </ul>
  </div>
</details>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);

  // ---------- nastavení ----------
  const RADAR_MIN_ZOOM = 9;      // od jakého přiblížení načítat radary
  const SPEED_MIN_ZOOM = 13;     // od jakého přiblížení načítat limity
  const RADAR_WARN_M = 600;      // vzdálenost pro upozornění na radar
  const ROAD_SNAP_M = 35;        // jak daleko od silnice ještě bereme její limit
  const OVERPASS = [
    'https://overpass-api.de/api/interpreter',
    'https://overpass.kumi.systems/api/interpreter',
  ];
  const BUCKETS = [
    { max: 30,  color: '#34d399', label: 'do 30 km/h' },
    { max: 50,  color: '#fde047', label: '40–50 km/h' },
    { max: 80,  color: '#fb923c', label: '60–80 km/h' },
    { max: 100, color: '#f472b6', label: '90–100 km/h' },
    { max: 999, color: '#ff4d6d', label: '110 km/h a více' },
  ];
  const IMPLICIT = { 'CZ:urban': 50, 'CZ:rural': 90, 'CZ:trunk': 110, 'CZ:motorway': 130,
                     'CZ:living_street': 20, 'CZ:pedestrian_zone': 20, 'walk': 20 };

  $('legSpeed').innerHTML = BUCKETS.map(b =>
    `<li><span class="sw" style="background:${b.color}"></span>${b.label}</li>`).join('') +
    `<li><span class="radar" style="width:18px;height:18px;border-width:1px;box-shadow:none"></span>Radar / měření rychlosti</li>`;

  // ---------- mapa ----------
  const map = L.map('map', { preferCanvas: true, zoomControl: false }).setView([49.82, 15.47], 8);
  L.control.zoom({ position: 'topright' }).addTo(map);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    subdomains: 'abcd', maxZoom: 20,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>',
  }).addTo(map);

  const speedLayer = L.layerGroup().addTo(map);
  const radarLayer = L.layerGroup().addTo(map);

  const radarIcon = L.divIcon({
    className: '', iconSize: [30, 30], iconAnchor: [15, 15], popupAnchor: [0, -14],
    html: '<div class="radar"><svg viewBox="0 0 24 24"><path d="M9 4 7.2 6H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-3.2L15 4H9zm3 4.5a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9zm0 2a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5z"/></svg></div>',
  });

  // ---------- data ----------
  const radars = new Map();   // id -> {lat, lon, limit}
  const roads = new Map();    // id -> {pts:[[lat,lon]...], limit, name}
  let loaded = { radar: null, speed: null };   // naposledy načtené oblasti (L.LatLngBounds)
  let ctrl = null, timer = null;

  function setStatus(text, err) {
    $('status').textContent = text;
    $('status').classList.toggle('err', !!err);
  }

  function parseLimit(v) {
    if (!v) return null;
    if (IMPLICIT[v] != null) return IMPLICIT[v];
    const m = /^(\d+(?:\.\d+)?)\s*(mph)?$/.exec(v.trim());
    if (!m) return null;
    return Math.round(m[2] ? m[1] * 1.609 : +m[1]);
  }
  const colorFor = limit => BUCKETS.find(b => limit <= b.max).color;
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  async function overpass(query, signal) {
    let lastErr;
    for (const url of OVERPASS) {
      try {
        const r = await fetch(url, { method: 'POST', body: 'data=' + encodeURIComponent(query), signal,
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' } });
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return await r.json();
      } catch (e) {
        if (e.name === 'AbortError') throw e;
        lastErr = e;
      }
    }
    throw lastErr;
  }

  const on = id => $(id).getAttribute('aria-pressed') === 'true';

  async function refresh() {
    const z = map.getZoom(), view = map.getBounds();
    const needRadar = on('tRadar') && z >= RADAR_MIN_ZOOM && !(loaded.radar && loaded.radar.contains(view));
    const needSpeed = on('tSpeed') && z >= SPEED_MIN_ZOOM && !(loaded.speed && loaded.speed.contains(view));

    if (!needRadar && !needSpeed) {
      if (z < RADAR_MIN_ZOOM) setStatus('Přibliž mapu, aby se zobrazily radary.');
      else if (z < SPEED_MIN_ZOOM && on('tSpeed')) setStatus(`Radarů v okolí: ${countInView()} · pro limity přibliž ještě víc.`);
      else setStatus(`Radarů v okolí: ${countInView()}`);
      return;
    }

    const area = view.pad(needSpeed ? 0.3 : 0.6);
    const bb = [area.getSouth(), area.getWest(), area.getNorth(), area.getEast()].map(n => n.toFixed(5)).join(',');
    let q = '[out:json][timeout:25];(';
    if (needRadar) q += `node["highway"="speed_camera"](${bb});`;
    if (needSpeed) q += `way["highway"]["maxspeed"](${bb});`;
    q += ');out geom;';

    if (ctrl) ctrl.abort();
    ctrl = new AbortController();
    setStatus('Načítám data…');
    try {
      const data = await overpass(q, ctrl.signal);
      for (const el of data.elements) {
        if (el.type === 'node' && !radars.has(el.id)) addRadar(el);
        else if (el.type === 'way' && !roads.has(el.id)) addRoad(el);
      }
      if (needRadar) loaded.radar = area;
      if (needSpeed) loaded.speed = area;
      setStatus(`Radarů v okolí: ${countInView()}` + (z < SPEED_MIN_ZOOM && on('tSpeed') ? ' · pro limity přibliž ještě víc.' : ''));
      updateDrive();
    } catch (e) {
      if (e.name !== 'AbortError') setStatus('Data se nepodařilo načíst. Zkus mapu posunout nebo to zopakuj za chvíli.', true);
    }
  }

  function countInView() {
    const b = map.getBounds(); let n = 0;
    for (const r of radars.values()) if (b.contains([r.lat, r.lon])) n++;
    return n;
  }

  function addRadar(el) {
    const t = el.tags || {}, limit = parseLimit(t.maxspeed);
    radars.set(el.id, { lat: el.lat, lon: el.lon, limit });
    let html = '<b>📷 Radar – měření rychlosti</b>';
    html += limit ? `<br>Měřený limit: <b>${limit} km/h</b>` : '<br>Limit není v datech uveden.';
    if (t.name) html += '<br>' + esc(t.name);
    if (t.description) html += '<br>' + esc(t.description);
    L.marker([el.lat, el.lon], { icon: radarIcon, title: 'Radar' }).bindPopup(html).addTo(radarLayer);
  }

  function addRoad(el) {
    const limit = parseLimit(el.tags.maxspeed);
    if (!limit || !el.geometry) return;
    const pts = el.geometry.map(p => [p.lat, p.lon]);
    const name = el.tags.name || el.tags.ref || '';
    roads.set(el.id, { pts, limit, name });
    L.polyline(pts, { color: colorFor(limit), weight: 4, opacity: .85 })
      .bindTooltip(`${limit} km/h${name ? ' · ' + esc(name) : ''}`, { sticky: true })
      .addTo(speedLayer);
  }

  map.on('moveend', () => { clearTimeout(timer); timer = setTimeout(refresh, 450); });

  // ---------- přepínače ----------
  function toggle(id, fn) {
    $(id).addEventListener('click', () => {
      const v = !on(id);
      $(id).setAttribute('aria-pressed', v);
      fn && fn(v);
    });
  }
  toggle('tRadar', v => { v ? radarLayer.addTo(map) : radarLayer.remove(); refresh(); });
  toggle('tSpeed', v => { v ? speedLayer.addTo(map) : speedLayer.remove(); refresh(); });
  toggle('tSound');

  // ---------- hledání ----------
  $('search').addEventListener('submit', async e => {
    e.preventDefault();
    const q = $('q').value.trim();
    if (!q) return;
    setStatus('Hledám…');
    try {
      const r = await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&accept-language=cs&q=' + encodeURIComponent(q));
      const [hit] = await r.json();
      if (!hit) return setStatus('Nic jsem nenašel. Zkus jiný název.', true);
      stopFollow();
      const [s, n, w, ea] = hit.boundingbox.map(Number);
      map.fitBounds([[s, w], [n, ea]], { maxZoom: 15 });
    } catch { setStatus('Hledání se nepovedlo.', true); }
  });

  // ---------- jízda: moje rychlost, limit, radar před sebou ----------
  let watchId = null, follow = false, me = null, meMarker = null, accCircle = null, prev = null;
  const warned = new Set();

  function dist(a, b, c, d) {           // metry mezi dvěma body
    const R = 6371000, r = Math.PI / 180;
    const x = (d - b) * r * Math.cos((a + c) * r / 2), y = (c - a) * r;
    return Math.sqrt(x * x + y * y) * R;
  }
  function distToSeg(p, a, b) {          // metry od bodu k úsečce (lokální rovinná aproximace)
    const k = Math.cos(p[0] * Math.PI / 180);
    const px = p[1] * k, py = p[0], ax = a[1] * k, ay = a[0], bx = b[1] * k, by = b[0];
    const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy;
    const t = l2 ? Math.max(0, Math.min(1, ((px - ax) * dx + (py - ay) * dy) / l2)) : 0;
    return Math.hypot(px - ax - t * dx, py - ay - t * dy) * 111320;
  }
  function nearestRoad(p) {
    let best = null, bd = ROAD_SNAP_M;
    for (const r of roads.values()) {
      for (let i = 1; i < r.pts.length; i++) {
        const a = r.pts[i - 1], b = r.pts[i];
        if (Math.abs(a[0] - p[0]) > .01 || Math.abs(a[1] - p[1]) > .02) continue;
        const d = distToSeg(p, a, b);
        if (d < bd) { bd = d; best = r; }
      }
    }
    return best;
  }

  function beep() {
    if (!on('tSound')) return;
    try {
      const ac = beep.ac || (beep.ac = new (window.AudioContext || window.webkitAudioContext)());
      [0, .22].forEach(t => {
        const o = ac.createOscillator(), g = ac.createGain();
        o.frequency.value = 880; g.gain.value = .15;
        o.connect(g).connect(ac.destination);
        o.start(ac.currentTime + t); o.stop(ac.currentTime + t + .14);
      });
    } catch { /* zvuk není k dispozici */ }
  }

  function updateDrive() {
    if (!me) return;
    const road = nearestRoad([me.lat, me.lon]);
    const lim = $('limit');
    lim.textContent = road ? road.limit : '–';
    lim.classList.toggle('unknown', !road);

    const kmh = me.speed != null ? Math.round(me.speed * 3.6) : null;
    $('speed').firstChild.nodeValue = kmh != null ? kmh : '–';
    const over = road && kmh != null && kmh > road.limit + 3;
    $('hud').classList.toggle('over', !!over);
    $('hudLbl').textContent = over ? `Zpomal! Limit je ${road.limit} km/h.`
      : road ? (road.name || 'Limit na této silnici')
      : map.getZoom() < SPEED_MIN_ZOOM ? 'Pro zjištění limitu přibliž mapu.' : 'Limit tu v datech není – platí obecná pravidla.';

    // nejbližší radar
    let near = null, nd = RADAR_WARN_M;
    for (const [id, r] of radars) {
      const d = dist(me.lat, me.lon, r.lat, r.lon);
      if (d < nd) { nd = d; near = { id, ...r }; }
      else if (d > RADAR_WARN_M * 2) warned.delete(id);
    }
    const al = $('alert');
    if (near && on('tRadar')) {
      al.textContent = `📷 Radar za ${Math.round(nd / 10) * 10} m` + (near.limit ? ` · limit ${near.limit}` : '');
      al.classList.add('show');
      if (!warned.has(near.id)) { warned.add(near.id); beep(); }
    } else al.classList.remove('show');
  }

  function onPos(pos) {
    const c = pos.coords;
    let speed = c.speed;
    if ((speed == null || isNaN(speed)) && prev) {       // dopočet rychlosti, když ji zařízení neposílá
      const dt = (pos.timestamp - prev.t) / 1000;
      if (dt > .5 && dt < 15) speed = dist(prev.lat, prev.lon, c.latitude, c.longitude) / dt;
    }
    prev = { lat: c.latitude, lon: c.longitude, t: pos.timestamp };
    me = { lat: c.latitude, lon: c.longitude, speed: speed != null && !isNaN(speed) ? speed : null };

    const ll = [me.lat, me.lon];
    if (!meMarker) {
      meMarker = L.marker(ll, { icon: L.divIcon({ className: '', html: '<div class="me"></div>', iconSize: [20, 20], iconAnchor: [10, 10] }), zIndexOffset: 1000 }).addTo(map);
      accCircle = L.circle(ll, { radius: c.accuracy, color: '#c084fc', weight: 1, fillOpacity: .08, interactive: false }).addTo(map);
    } else { meMarker.setLatLng(ll); accCircle.setLatLng(ll).setRadius(c.accuracy); }
    if (follow) map.setView(ll, Math.max(map.getZoom(), 16), { animate: true });
    updateDrive();
  }

  function stopFollow() {
    follow = false;
    $('locate').textContent = '◎ Jedu';
  }
  $('locate').addEventListener('click', () => {
    if (!navigator.geolocation) return setStatus('Tento prohlížeč neumí zjistit polohu.', true);
    if (follow) return stopFollow();
    follow = true;
    $('locate').textContent = '◉ Sleduji';
    if (me) map.setView([me.lat, me.lon], Math.max(map.getZoom(), 16));
    if (watchId == null) {
      setStatus('Zjišťuji polohu…');
      watchId = navigator.geolocation.watchPosition(onPos, err => {
        setStatus(err.code === 1 ? 'Přístup k poloze byl zamítnut. Povol ho v prohlížeči.' : 'Polohu se nepodařilo zjistit.', true);
        if (err.code === 1) { navigator.geolocation.clearWatch(watchId); watchId = null; stopFollow(); }
      }, { enableHighAccuracy: true, maximumAge: 1000, timeout: 20000 });
    }
  });
  map.on('dragstart', stopFollow);

  refresh();
})();
</script>
</body>
</html>
