<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fialová mapa – navigace, radary a rychlostní limity</title>
<meta name="description" content="Fialová mapa s navigací, radary, úsekovým měřením a rychlostními limity.">
<meta name="theme-color" content="#1a0b2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mapa">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="map"></div>

<div id="left">
  <div id="searchWrap">
    <form id="search" class="glass" role="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 3a7 7 0 0 1 5.6 11.2l4.6 4.6-1.4 1.4-4.6-4.6A7 7 0 1 1 10 3zm0 2a5 5 0 1 0 0 10 5 5 0 0 0 0-10z"/></svg>
      <input id="q" type="search" placeholder="Hledat v mapě" autocomplete="off" aria-label="Hledat místo" enterkeyhint="search">
      <button type="button" id="clear" aria-label="Smazat hledání" hidden>×</button>
    </form>
    <ul id="sugg" class="glass" hidden></ul>
  </div>
  <div id="chips">
    <button class="chip glass cat" data-cat="fuel">⛽ Pumpy</button>
    <button class="chip glass cat" data-cat="parking">🅿️ Parkování</button>
    <button class="chip glass cat" data-cat="charge">🔌 Nabíječky</button>
    <button class="chip glass cat" data-cat="food">🍽️ Jídlo</button>
    <button class="chip glass cat" data-cat="shop">🛒 Obchody</button>
  </div>
  <button id="locAsk" class="chip glass" aria-pressed="true" hidden>📍 Zapnout moji polohu</button>
  <div id="status" class="glass" role="status" hidden></div>
  <section id="sheet" class="glass" hidden>
    <button class="grab" id="grab" aria-label="Sbalit nebo rozbalit kartu"></button>
    <div id="sheetBody"></div>
  </section>
</div>

<div id="alert" class="glass" role="alert"></div>

<div id="hud" class="glass" hidden>
  <div class="sign unknown" id="limit" title="Povolená rychlost">–</div>
  <div><div id="speed">–</div><div id="speedU">km/h</div></div>
</div>

<div id="layers" class="glass" hidden>
  <h3>Typ mapy</h3>
  <div class="types">
    <button data-type="purple"><span class="th purple"></span>Fialová</button>
    <button data-type="light"><span class="th light"></span>Světlá</button>
    <button data-type="sat"><span class="th sat"></span>Satelitní</button>
  </div>
  <h3>Zobrazit a hlásit</h3>
  <div class="opts">
    <button class="chip glass" id="tRadar" aria-pressed="true">📷 Radary</button>
    <button class="chip glass" id="tSpeed" aria-pressed="true">🚦 Limity</button>
    <button class="chip glass" id="tSound" aria-pressed="true">🔔 Pípání</button>
    <button class="chip glass" id="tVoice" aria-pressed="true">🗣️ Hlas</button>
  </div>
  <h3>Limity na silnicích</h3>
  <ul id="legSpeed"></ul>
  <h3>Obecné limity v ČR</h3>
  <ul>
    <li>V obci <b>50</b></li>
    <li>Mimo obec <b>90</b></li>
    <li>Silnice pro motorová vozidla <b>110</b></li>
    <li>Dálnice <b>130</b></li>
    <li>Dálnice v obci <b>80</b></li>
    <li>Obytná zóna <b>20</b></li>
  </ul>
</div>

<div id="fabs">
  <button class="fab glass" id="layersBtn" aria-label="Vrstvy, nastavení a legenda" title="Vrstvy, nastavení a legenda">
    <svg viewBox="0 0 24 24"><path d="m12 2 10 5.5L12 13 2 7.5 12 2zm-7.9 9.6L12 16l7.9-4.4L22 12.8 12 18.3 2 12.8l2.1-1.2zm0 4.6L12 20.6l7.9-4.4 2.1 1.2-10 5.5-10-5.5 2.1-1.2z"/></svg>
  </button>
  <div class="zoom glass">
    <button id="zin" aria-label="Přiblížit">+</button>
    <button id="zout" aria-label="Oddálit">−</button>
  </div>
  <button class="fab glass" id="locate" aria-label="Moje poloha" title="Moje poloha">
    <svg viewBox="0 0 24 24"><path d="M21 3 3 10.5v1l6.8 2.7L12.5 21h1L21 3z"/></svg>
  </button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="app.js"></script>
</body>
</html>
